
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NdavaGoldBot</title>
<style>
body{margin:0;padding:18px;background:#08111f;color:white;font-family:Arial}
h1{color:#f5c542}
.card{background:#17263d;padding:18px;border-radius:14px;margin:15px 0}
select,button{width:100%;padding:14px;margin-top:10px;border-radius:9px;font-size:16px}
select{background:#091525;color:white}
button{background:#f5c542;font-weight:bold;border:0}
.price{font-size:29px;color:#f5c542;font-weight:bold}
.status{font-size:21px;font-weight:bold}
small{color:#bdc8d8}
</style>
</head>
<body>
<h1>NdavaGoldBot</h1>
<p>Forex Signal Dashboard</p>

<div class="card">
<label for="market">Chagua soko</label>
<select id="market">
<option value="XAU">Gold (XAU/USD)</option>
<option value="BTCUSDT">Bitcoin</option>
<option value="ETHUSDT">Ethereum</option>
<option value="BNBUSDT">BNB</option>
<option value="SOLUSDT">Solana</option>
</select>
<button onclick="analyze()">CHAMBUA SOKO</button>
</div>

<div class="card">
<p>Bei ya soko</p>
<div id="price" class="price">Inasubiri data...</div>
<p id="time"><small>Bado haijaunganishwa</small></p>
</div>

<div class="card">
<p>Hali ya uchambuzi</p>
<div id="signal" class="status">SUBIRI DATA</div>
<p id="message">Bonyeza Chambua Soko.</p>
</div>

<div class="card">
<p>Hali ya bot</p>
<p id="connection">Tayari kuanza.</p>
<small>Bot hii haitoi oda za biashara. Ishara ni za majaribio, si ushauri wa kifedha.</small>
</div>

<script>
async function analyze(){
 const market=document.getElementById('market').value;
 const priceBox=document.getElementById('price');
 const signal=document.getElementById('signal');
 const message=document.getElementById('message');
 const connection=document.getElementById('connection');

 priceBox.textContent='Inatafuta bei...';
 signal.textContent='SUBIRI DATA';
 message.textContent='Inaunganisha na chanzo cha data...';

 try{
  let price, closes=[];

  if(market==='XAU'){
   const r=await fetch('https://api.gold-api.com/price/XAU');
   if(!r.ok) throw Error('Gold-API haijatoa bei. Jaribu tena baadaye.');
   const d=await r.json();
   price=Number(d.price);
  }else{
   const r=await fetch(
    'https://api.binance.com/api/v3/klines?symbol='+
    market+'&interval=1m&limit=30'
   );
   if(!r.ok) throw Error('Binance haipatikani sasa.');
   const d=await r.json();
   closes=d.map(c=>Number(c[4]));
   price=closes[closes.length-1];
  }

  if(!Number.isFinite(price)||price<=0)
   throw Error('Bei halisi haijapatikana.');

  priceBox.textContent=price.toLocaleString('en-US',{
   minimumFractionDigits:2,maximumFractionDigits:5
  });
  document.getElementById('time').textContent=
   'Muda: '+new Date().toLocaleTimeString();
  connection.textContent='Bei imepokelewa kutoka chanzo cha data.';

  if(closes.length>=21){
   const recent=closes.slice(-9).reduce((a,b)=>a+b,0)/9;
   const longer=closes.slice(-21).reduce((a,b)=>a+b,0)/21;

   if(recent>longer){
    signal.textContent='BUY — MAJARIBIO';
    message.textContent='Wastani mfupi uko juu ya wastani mrefu. Thibitisha mwenendo kabla ya kufanya uamuzi.';
   }else if(recent<longer){
    signal.textContent='SELL — MAJARIBIO';
    message.textContent='Wastani mfupi uko chini ya wastani mrefu. Thibitisha mwenendo kabla ya kufanya uamuzi.';
   }else{
    signal.textContent='SUBIRI';
    message.textContent='Mwelekeo haujaonekana wazi.';
   }
  }else{
   signal.textContent='SUBIRI DATA';
   message.textContent='Bei imepatikana; bado hakuna data ya kutosha kuchambua.';
  }
 }catch(e){
  priceBox.textContent='Haijapatikana';
  signal.textContent='SUBIRI DATA';
  message.textContent=e.message;
  connection.textContent='Muunganisho haujafaulu. Hakuna ishara iliyothibitishwa.';
 }
}
</script>
</body>
</html>
