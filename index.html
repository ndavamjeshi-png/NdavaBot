<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NdavaGoldBot</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:16px}
h1{color:#f5c451}
.card{background:#1c293b;padding:18px;margin:14px 0;border-radius:14px}
button{width:100%;padding:14px;background:#f5c451;border:0;border-radius:8px;font-weight:bold}
.price{font-size:30px;color:#f5c451}
</style>
</head>
<body>
<h1>NdavaGoldBot</h1>
<p>Forex Signal Dashboard - XAU/USD</p>
<div class="card">
<p>Bei ya Gold</p>
<div class="price" id="price">Inatafuta bei...</div>
<p id="status">Subiri...</p>
<button onclick="refresh()">Sasisha Bei</button>
</div>
<div class="card">
<h3>Uchambuzi wa Soko</h3>
<h2 id="signal">SUBIRI DATA</h2>
<p id="analysis">Subiri taarifa za soko.</p>
<p>Entry: <span id="entry">--</span></p>
<p>Stop Loss: --</p>
<p>Take Profit: --</p>
</div>
<script>
async function refresh(){
try{
const r=await fetch('https://api.gold-api.com/price/XAU');
if(!r.ok)throw Error();
const d=await r.json();
const p=Number(d.price);
if(!Number.isFinite(p))throw Error();
document.getElementById('price').textContent='$'+p.toFixed(2);
document.getElementById('entry').textContent=p.toFixed(2);
document.getElementById('status').textContent='Bei imepatikana';
document.getElementById('analysis').textContent='Bei imepatikana. BUY au SELL haijathibitishwa.';
}catch(e){
document.getElementById('price').textContent='Bei haipatikani';
document.getElementById('status').textContent='Angalia intaneti ujaribu tena';
}}
refresh();
</script>
</body>
</html>
