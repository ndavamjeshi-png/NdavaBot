
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NdavaGoldBot</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:18px}
header{color:#f5c542;font-size:27px;font-weight:bold}
.card{background:#1d293b;padding:18px;border-radius:14px;margin:15px 0}
h2{margin-top:5px}
select,button{padding:13px;border-radius:8px;border:0;width:100%;margin-top:10px;font-size:16px}
button{background:#f5c542;color:#101827;font-weight:bold}
.price{font-size:27px;color:#f5c542}
.muted{color:#bdc8d8}
</style>
</head>
<body>
<header>NDAVA GOLD BOT</header>
<p class="muted">Gold · Forex · Crypto</p>

<div class="card">
<h2>Chagua soko</h2>
<select id="market">
<option value="XAU/USD">Gold (XAU/USD)</option>
<option value="EUR/USD">EUR/USD</option>
<option value="GBP/USD">GBP/USD</option>
<option value="USD/JPY">USD/JPY</option>
<option value="BTC/USD">Bitcoin (BTC/USD)</option>
<option value="ETH/USD">Ethereum (ETH/USD)</option>
</select>
<button onclick="analyze()">Chambua soko</button>
</div>

<div class="card">
<h2 id="pair">Gold (XAU/USD)</h2>
<div class="price" id="signal">SUBIRI</div>
<p id="detail">Bonyeza Chambua soko ili kuanza.</p>
<p class="muted">Bei halisi haijaunganishwa bado.</p>
</div>

<div class="card">
<h2>Usimamizi wa hatari</h2>
<label>Salio la akaunti ($)</label>
<input id="balance" type="number" value="100" style="width:95%;padding:10px">
<label>Hatari (%)</label>
<input id="risk" type="number" value="1" min="0.1" max="5" step="0.1" style="width:95%;padding:10px">
<button onclick="calcRisk()">Hesabu hatari</button>
<p id="result">Hatari: $1.00</p>
</div>

<p class="muted">Toleo la mwanzo. Halifanyi biashara wala kutoa ishara za soko halisi bila kuunganishwa na data ya soko.</p>

<script>
function analyze(){
const m=document.getElementById('market').value;
document.getElementById('pair').textContent=m;
document.getElementById('signal').textContent='SUBIRI';
document.getElementById('detail').textContent=
'Data ya '+m+' bado haijaunganishwa. Hakuna ishara ya kununua au kuuza iliyothibitishwa.';
}
function calcRisk(){
const b=Number(document.getElementById('balance').value);
const r=Number(document.getElementById('risk').value);
if(b<=0||r<=0||r>5){
document.getElementById('result').textContent='Weka salio na hatari sahihi (0.1%–5%).';
return;
}
document.getElementById('result').textContent=
'Hatari ya juu iliyochaguliwa: $'+(b*r/100).toFixed(2);
}
</script>
</body>
</html>
